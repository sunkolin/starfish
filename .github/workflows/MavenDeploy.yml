name: MavenDeploy

# dev是开发分支，开发完成后，修改版本号为正式版本号，合并到具体分支，例如2.4.0，再合并到main分支，触发流程打正式包
# dev 分支只打 SNAPSHOT 包，
# main 分支只打 Release 包
on:
  push:
    branches:
      - "main"
      - "dev"
#      - "2.4.0"
#      - "2.3.x"
#      - "dev"
#      - "*"
#  schedule:
#    - cron: '0 2 * * *'
env:
  APPLICATION_NAME: "starfish"

jobs:
  MavenDeploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout
        uses: actions/checkout@main

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Package
        run: mvn --batch-mode --update-snapshots package -Dmaven.test.skip=true

      - name: Deploy SNAPSHOT (dev branch)
        if: github.ref_name == 'dev'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: mvn --batch-mode --update-snapshots deploy -Dmaven.test.skip=true

      - name: Deploy Release (main branch)
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: mvn --batch-mode deploy -Dmaven.test.skip=true